name: EdgeDesk platform builds
'on':
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      upload-tag:
        type: string
        default: nightly
      source-ref:
        required: true
        type: string
      version:
        required: true
        type: string
env:
  SCITER_RUST_VERSION: '1.75'
  RUST_VERSION: '1.75'
  MAC_RUST_VERSION: '1.81'
  CARGO_NDK_VERSION: 3.1.2
  SCITER_ARMV7_CMAKE_VERSION: 3.29.7
  SCITER_NASM_DEBVERSION: 2.15.05-1
  LLVM_VERSION: 15.0.6
  FLUTTER_VERSION: 3.24.5
  ANDROID_FLUTTER_VERSION: 3.24.5
  FLUTTER_WINDOWS_ARM_VERSION: 3.44.0
  FLUTTER_ELINUX_VERSION: 3.16.9
  TAG_NAME: ${{ inputs.upload-tag }}
  VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
  VCPKG_COMMIT_ID: 120deac3062162151622ca4860575a33844ba10b
  ARMV7_VCPKG_COMMIT_ID: 6f29f12e82a8293156836ad81cc9bf5af41fe836
  VERSION: ${{ inputs.version }}
  NDK_VERSION: r28c
  ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
  MACOS_P12_BASE64: ${{ secrets.MACOS_P12_BASE64 }}
  UPLOAD_ARTIFACT: ${{ inputs.upload-artifact }}
  SIGN_BASE_URL: ${{ secrets.SIGN_BASE_URL }}-2
jobs:
  generate-bridge:
    uses: ./.github/workflows/edgedesk-bridge.yml
    with:
      source-ref: ${{ inputs.source-ref }}
  build-RustDeskTempTopMostWindow:
    uses: ./.github/workflows/edgedesk-topmost.yml
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: windows-2022
          platform: x64
        - target: windows-11-arm
          platform: ARM64
    with:
      upload-artifact: ${{ inputs.upload-artifact }}
      target: ${{ matrix.job.target }}
      configuration: Release
      platform: ${{ matrix.job.platform }}
      target_version: Windows10
  build-for-windows-flutter:
    name: ${{ matrix.job.target }}
    needs:
    - build-RustDeskTempTopMostWindow
    - generate-bridge
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-pc-windows-msvc
          os: windows-2022
          arch: x86_64
          flutter-arch: x64
          vcpkg-triplet: x64-windows-static
          build-args: --vram
        - target: aarch64-pc-windows-msvc
          os: windows-11-arm
          arch: aarch64
          flutter-arch: arm64
          vcpkg-triplet: arm64-windows-static
          build-args: ''
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL
          || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN
          || '''');

          '
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        ref: ${{ inputs.source-ref }}
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' ||
          'bridge-artifact' }}
        path: ./
    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
      with:
        version: ${{ env.LLVM_VERSION }}
    - name: Install flutter
      id: flutter
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
      with:
        channel: stable
        flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION
          || env.FLUTTER_VERSION }}
        architecture: x64
    - name: Force arm64 Dart SDK + engine
      if: ${{ matrix.job.arch == 'aarch64' }}
      run: "$flutterRoot = \"${{ steps.flutter.outputs['CACHE-PATH'] }}\"\nWrite-Host\
        \ \"PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE\"\nWrite-Host \"Flutter\
        \ root: $flutterRoot\"\nRemove-Item -Force \"$flutterRoot\\bin\\cache\\engine-dart-sdk.stamp\"\
        \ -ErrorAction SilentlyContinue\n& \"$flutterRoot\\bin\\internal\\update_dart_sdk.ps1\"\
        \n# Confirm the Dart we ended up with is arm64 (\"on windows_arm64\"); fail\
        \ loudly if not.\n$dartVer = & \"$flutterRoot\\bin\\dart.bat\" --version 2>&1\
        \ | Out-String\nWrite-Host $dartVer\nif ($dartVer -notmatch \"windows_arm64\"\
        ) {\n  Write-Error \"Expected an arm64 Dart SDK but got: $dartVer\"\n  exit\
        \ 1\n}\n& \"$flutterRoot\\bin\\flutter.bat\" precache --windows\n# Fail fast\
        \ if precache pulled the wrong-arch Windows engine: an arm64 Dart should\n\
        # fetch windows-arm64 engine artifacts. Bailing here saves the ~25min Rust\
        \ build.\n$engineDir = \"$flutterRoot\\bin\\cache\\artifacts\\engine\"\nWrite-Host\
        \ \"Engine artifacts present:\"\nGet-ChildItem $engineDir -Directory | Select-Object\
        \ -ExpandProperty Name | Write-Host\nif (-not (Test-Path \"$engineDir\\windows-arm64-release\"\
        )) {\n  Write-Error \"Expected windows-arm64-release engine artifacts but\
        \ they are missing (wrong-arch SDK).\"\n  exit 1\n}\n"
    - name: Replace engine with rustdesk custom flutter engine
      if: ${{ matrix.job.arch == 'x86_64' }}
      run: 'flutter doctor -v

        flutter precache --windows

        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip
        -OutFile windows-x64-release.zip

        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release

        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{
        env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

        '
    - name: Patch flutter
      if: ${{ matrix.job.arch == 'x86_64' }}
      shell: bash
      run: 'cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname
        $(dirname $(which flutter)))

        cd $(dirname $(dirname $(which flutter)))

        [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

        '
    - name: Patch RustDesk sources for Flutter 3.44 (arm64)
      if: ${{ matrix.job.arch == 'aarch64' }}
      shell: bash
      run: bash .github/patches/apply_flutter_3.44_source_patches.sh
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.SCITER_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: ${{ matrix.job.os }}
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      run: "if ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --triplet ${{ matrix.job.vcpkg-triplet\
        \ }} \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"; then\n  find \"${VCPKG_ROOT}/\"\
        \ -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\
        \n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\n\
        fi\nhead -n 100 \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet\
        \ }}-rel-out.log\" || true\n"
      shell: bash
    - name: Set SODIUM_LIB_DIR (arm64)
      if: ${{ matrix.job.arch == 'aarch64' }}
      shell: bash
      run: echo "SODIUM_LIB_DIR=$VCPKG_ROOT/installed/${{ matrix.job.vcpkg-triplet
        }}/lib" >> "$GITHUB_ENV"
    - name: Build rustdesk
      run: "# Windows: build RustDesk\n# --hwcodec is shared by all Windows targets;\
        \ per-target extras (e.g. --vram) come from the matrix\npython3 .\\build.py\
        \ --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args\
        \ }}\nmv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release\
        \ ./rustdesk\n\n# Download usbmmidd_v2.zip and extract it to ./rustdesk\n\
        Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip\
        \ -OutFile usbmmidd_v2.zip\nExpand-Archive usbmmidd_v2.zip -DestinationPath\
        \ .\nRemove-Item -Path usbmmidd_v2\\Win32 -Recurse\nRemove-Item -Path \"usbmmidd_v2\\\
        deviceinstaller64.exe\", \"usbmmidd_v2\\deviceinstaller.exe\", \"usbmmidd_v2\\\
        usbmmidd.bat\"\nmv -Force .\\usbmmidd_v2 ./rustdesk\n\n# Download printer\
        \ driver files and extract them to ./rustdesk\ntry {\n  Invoke-WebRequest\
        \ -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip\
        \ -OutFile rustdesk_printer_driver_v4-1.4.zip\n  Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip\
        \ -OutFile printer_driver_adapter.zip\n  Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums\
        \ -OutFile sha256sums\n\n  # Check and move the files\n  $checksum_driver\
        \ = (Select-String -Path .\\sha256sums -Pattern '^([a-fA-F0-9]{64}) \\*rustdesk_printer_driver_v4-1.4\\\
        .zip$').Matches.Groups[1].Value\n  $downloadsum_driver = Get-FileHash -Path\
        \ rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256\n  $checksum_adapter\
        \ = (Select-String -Path .\\sha256sums -Pattern '^([a-fA-F0-9]{64}) \\*printer_driver_adapter\\\
        .zip$').Matches.Groups[1].Value\n  $downloadsum_adapter = Get-FileHash -Path\
        \ printer_driver_adapter.zip -Algorithm SHA256\n  if ($checksum_driver -eq\
        \ $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash)\
        \ {\n      Write-Output \"rustdesk_printer_driver_v4-1.4, checksums match,\
        \ extract the file.\"\n      Expand-Archive rustdesk_printer_driver_v4-1.4.zip\
        \ -DestinationPath .\n      mkdir ./rustdesk/drivers\n      mv -Force .\\\
        rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver\n\
        \      Expand-Archive printer_driver_adapter.zip -DestinationPath .\n    \
        \  mv -Force .\\printer_driver_adapter.dll ./rustdesk\n  } elseif ($checksum_driver\
        \ -ne $downloadsum_driver.Hash) {\n      Write-Output \"rustdesk_printer_driver_v4-1.4,\
        \ checksums do not match, ignore the file.\"\n  } else {\n      Write-Output\
        \ \"printer_driver_adapter.dll, checksums do not match, ignore the file.\"\
        \n  }\n} catch {\n    Write-Host \"Ingore the printer driver error.\"\n}\n"
    - name: find Runner.res
      continue-on-error: true
      shell: bash
      run: "runner_res=$(find . -name \"Runner.res\");\nif [ \"$runner_res\" == \"\
        \" ]; then\n  echo \"Runner.res: not found\";\nelse\n  echo \"Runner.res:\
        \ $runner_res\";\n  cp $runner_res ./libs/portable/Runner.res;\n  echo \"\
        list ./libs/portable/Runner.res\";\n  ls -l ./libs/portable/Runner.res;\n\
        fi\n"
    - name: Download RustDeskTempTopMostWindow artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      if: ${{ inputs.upload-artifact }}
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64'
          || 'topmostwindow-artifacts-x64' }}
        path: ./rustdesk
    - name: Upload unsigned
      if: env.UPLOAD_ARTIFACT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-unsigned-windows-${{ matrix.job.arch }}
        path: rustdesk
    - name: Sign rustdesk files
      if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
      shell: bash
      run: 'pip3 install requests argparse

        BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY }}
        python3 res/job.py sign_files ./rustdesk/

        '
    - name: Build self-extracted executable
      shell: bash
      if: env.UPLOAD_ARTIFACT == 'true'
      run: 'sed -i ''/dpiAware/d'' res/manifest.xml

        pushd ./libs/portable

        pip3 install -r requirements.txt

        python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe

        popd

        mkdir -p ./SignOutput

        mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{
        env.VERSION }}-${{ matrix.job.arch }}.exe

        '
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce
    - name: Build msi
      if: env.UPLOAD_ARTIFACT == 'true'
      run: 'pushd ./res/msi

        python preprocess.py --arp -d ../../rustdesk

        nuget restore msi.sln

        $msiPlatform = if (''${{ matrix.job.arch }}'' -eq ''aarch64'') { ''ARM64''
        } else { ''x64'' }

        msbuild msi.sln -p:Configuration=Release -p:Platform=$msiPlatform /p:TargetVersion=Windows10

        $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object
        -First 1

        mv $msi.FullName ../../SignOutput/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch
        }}.msi

        sha256sum ../../SignOutput/rustdesk-*.msi

        '
    - name: Sign rustdesk self-extracted file
      if: env.UPLOAD_ARTIFACT == 'true' && env.SIGN_BASE_URL != '-2'
      shell: bash
      run: 'BASE_URL=${{ env.SIGN_BASE_URL }} SECRET_KEY=${{ secrets.SIGN_SECRET_KEY
        }} python3 res/job.py sign_files ./SignOutput

        '
    - name: Collect Publish Release
      uses: actions/upload-artifact@v4
      with:
        name: package-build-for-windows-flutter-23-${{ matrix.job.arch }}
        path: './SignOutput/rustdesk-*.msi

          ./SignOutput/rustdesk-*.exe

          '
        if-no-files-found: error
      if: env.UPLOAD_ARTIFACT == 'true'
    timeout-minutes: 180
  build-rustdesk-ios:
    if: ${{ inputs.upload-artifact }}
    name: build rustdesk ios ipa
    runs-on: ${{ matrix.job.os }}
    needs:
    - generate-bridge
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: aarch64
          target: aarch64-apple-ios
          os: macos-latest
          vcpkg-triplet: arm64-ios
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL
          || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN
          || '''');

          '
    - name: Install dependencies
      run: 'brew install nasm yasm

        '
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        ref: ${{ inputs.source-ref }}
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - name: Patch flutter
      run: 'cd $(dirname $(dirname $(which flutter)))

        [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply ${{ github.workspace
        }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

        '
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      run: "if ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --triplet ${{ matrix.job.vcpkg-triplet\
        \ }} \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"; then\n  find \"${VCPKG_ROOT}/\"\
        \ -name \"*.log\" | while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\
        \n    cat \"$_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\n\
        fi\nhead -n 100 \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet\
        \ }}-rel-out.log\" || true\n"
      shell: bash
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: rustdesk-lib-cache-ios
        key: ${{ matrix.job.target }}
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Build rustdesk lib
      run: 'rustup target add ${{ matrix.job.target }}

        cargo build --locked --features flutter,hwcodec --release --target aarch64-apple-ios
        --lib

        '
    - name: Upload liblibrustdesk.a Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: liblibrustdesk.a
        path: target/aarch64-apple-ios/release/liblibrustdesk.a
    - name: Build rustdesk
      shell: bash
      run: 'cd flutter

        flutter build ios --release --no-codesign

        mkdir -p build/ios/Payload

        cp -R build/ios/iphoneos/Runner.app build/ios/Payload/EdgeDesk.app

        cd build/ios

        zip -qry ../../../EdgeDesk-${{ env.VERSION }}-ios-unsigned.ipa Payload'
    - name: Collect unsigned IPA
      uses: actions/upload-artifact@v4
      with:
        name: package-ios
        path: EdgeDesk-*-ios-unsigned.ipa
        if-no-files-found: error
    timeout-minutes: 180
  build-for-macOS:
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    needs:
    - generate-bridge
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-apple-darwin
          os: macos-15-intel
          extra-build-args: ''
          arch: x86_64
          vcpkg-triplet: x64-osx
        - target: aarch64-apple-darwin
          os: macos-14
          extra-build-args: --screencapturekit
          arch: aarch64
          vcpkg-triplet: arm64-osx
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL
          || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN
          || '''');

          '
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        ref: ${{ inputs.source-ref }}
    - name: Import the codesign cert
      if: env.MACOS_P12_BASE64 != null
      uses: apple-actions/import-codesign-certs@253ddeeac23f2bdad1646faac5c8c2832e800071
      with:
        p12-file-base64: ${{ secrets.MACOS_P12_BASE64 }}
        p12-password: ${{ secrets.MACOS_P12_PASSWORD }}
        keychain: rustdesk
    - name: Check sign and import sign key
      if: env.MACOS_P12_BASE64 != null
      run: 'security default-keychain -s rustdesk.keychain

        security find-identity -v

        '
    - name: Import notarize key
      if: env.MACOS_P12_BASE64 != null
      uses: timheuer/base64-to-file@adaa40c0c581f276132199d4cf60afa07ce60eac
      with:
        fileName: rustdesk.json
        fileDir: ${{ github.workspace }}
        encodedString: ${{ secrets.MACOS_NOTARIZE_JSON }}
    - name: Install rcodesign tool
      if: env.MACOS_P12_BASE64 != null
      shell: bash
      run: 'pushd /tmp

        wget https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign%2F0.22.0/apple-codesign-0.22.0-macos-universal.tar.gz

        tar -zxvf apple-codesign-0.22.0-macos-universal.tar.gz

        mv apple-codesign-0.22.0-macos-universal/rcodesign /usr/local/bin

        popd

        '
    - name: Install build runtime
      run: "brew install llvm create-dmg\n# pkg-config is handled in a separate step,\
        \ because it may be already installed by `macos-latest`(14.7.1) runner\nif\
        \ command -v pkg-config &>/dev/null; then\n    echo \"pkg-config is already\
        \ installed\"\nelse\n    brew install pkg-config\nfi\n"
    - name: Install NASM
      run: '# Install NASM 2.16.x from official release.

        # Do NOT use `brew install nasm` which installs NASM 3.x.

        # NASM 3.x is a complete rewrite with incompatible CLI options and removed
        features.

        # aom and other multimedia libraries require NASM 2.x for x86/x86_64 assembly.

        wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip

        unzip nasm-2.16.03-macosx.zip

        sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm

        nasm --version

        '
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.FLUTTER_VERSION }}
    - name: Patch flutter
      run: 'cd $(dirname $(dirname $(which flutter)))

        [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]] && git apply ${{ github.workspace
        }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

        '
    - name: Workaround for flutter issue
      shell: bash
      run: 'cd "$(dirname "$(which flutter)")"

        # https://github.com/flutter/flutter/issues/133533

        sed -i -e ''s/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g''
        ../packages/flutter/lib/src/scheduler/binding.dart

        grep -n ''_setFramesEnabledState(false);'' ../packages/flutter/lib/src/scheduler/binding.dart

        '
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.MAC_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: ${{ matrix.job.os }}
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      run: "if ! $VCPKG_ROOT/vcpkg \\\n  install \\\n  --x-install-root=\"$VCPKG_ROOT/installed\"\
        ; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" | while read -r _1; do\n\
        \    echo \"$_1:\"\n    echo \"======\"\n    cat \"$_1\"\n    echo \"======\"\
        \n    echo \"\"\n  done\n  exit 1\nfi\nhead -n 100 \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{\
        \ matrix.job.vcpkg-triplet }}-rel-out.log\" || true\n"
    - name: Show version information (Rust, cargo, Clang)
      shell: bash
      run: 'clang --version || true

        rustup -V

        rustup toolchain list

        rustup default

        cargo -V

        rustc -V

        '
    - name: Build rustdesk
      run: "if [ \"${{ matrix.job.target }}\" = \"aarch64-apple-darwin\" ]; then\n\
        \  MIN_MACOS_VERSION=\"12.3\"\n  sed -i -e \"s/MACOSX_DEPLOYMENT_TARGET\\\
        =[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/\" build.py\n\
        \  sed -i -e \"s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/\"\
        \ flutter/macos/Podfile\n  sed -i -e \"s/osx_minimum_system_version = \\\"\
        [0-9]*.[0-9]*\\\"/osx_minimum_system_version = \\\"${MIN_MACOS_VERSION}\\\"\
        /\" Cargo.toml\n  sed -i -e \"s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET\
        \ = ${MIN_MACOS_VERSION};/\" flutter/macos/Runner.xcodeproj/project.pbxproj\n\
        fi\n./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args\
        \ }}\n"
    - name: create unsigned dmg
      if: env.UPLOAD_ARTIFACT == 'true'
      run: 'CREATE_DMG="$(command -v create-dmg)"

        CREATE_DMG="$(readlink -f "$CREATE_DMG")"

        sed -i -e ''s/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/''
        "$CREATE_DMG"

        create-dmg --icon "EdgeDesk.app" 200 190 --hide-extension "EdgeDesk.app" --window-size
        800 400 --app-drop-link 600 185 rustdesk-${{ env.VERSION }}-${{ matrix.job.arch
        }}.dmg ./flutter/build/macos/Build/Products/Release/EdgeDesk.app

        '
    - name: Upload unsigned macOS app
      if: env.UPLOAD_ARTIFACT == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: rustdesk-unsigned-macos-${{ matrix.job.arch }}
        path: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
    - name: Codesign app and create signed dmg
      if: env.MACOS_P12_BASE64 != null && env.UPLOAD_ARTIFACT == 'true'
      run: '# Patch create-dmg to give more attempts to unmount image

        CREATE_DMG="$(command -v create-dmg)"

        CREATE_DMG="$(readlink -f "$CREATE_DMG")"

        sed -i -e ''s/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/''
        "$CREATE_DMG"

        # Unlock keychain

        security default-keychain -s rustdesk.keychain

        security unlock-keychain -p ${{ secrets.MACOS_P12_PASSWORD }} rustdesk.keychain

        # start sign the rustdesk.app and dmg

        rm -rf *.dmg || true

        codesign --force --options runtime -s ${{ secrets.MACOS_CODESIGN_IDENTITY
        }} --deep --strict ./flutter/build/macos/Build/Products/Release/EdgeDesk.app
        -vvv

        create-dmg --icon "EdgeDesk.app" 200 190 --hide-extension "EdgeDesk.app" --window-size
        800 400 --app-drop-link 600 185 rustdesk-${{ env.VERSION }}.dmg ./flutter/build/macos/Build/Products/Release/EdgeDesk.app

        codesign --force --options runtime -s ${{ secrets.MACOS_CODESIGN_IDENTITY
        }} --deep --strict rustdesk-${{ env.VERSION }}.dmg -vvv

        # notarize the rustdesk-${{ env.VERSION }}.dmg

        rcodesign notary-submit --api-key-path ${{ github.workspace }}/rustdesk.json  --staple
        rustdesk-${{ env.VERSION }}.dmg

        '
    - name: Rename rustdesk
      if: env.UPLOAD_ARTIFACT == 'true'
      run: "for name in rustdesk*??.dmg; do\n    mv \"$name\" \"${name%%.dmg}-${{\
        \ matrix.job.arch }}.dmg\"\ndone\n"
    - name: Collect Publish DMG package
      uses: actions/upload-artifact@v4
      with:
        name: package-build-for-macOS-22-${{ matrix.job.arch }}
        path: 'rustdesk*-${{ matrix.job.arch }}.dmg

          '
        if-no-files-found: error
      if: env.UPLOAD_ARTIFACT == 'true'
    - name: Archive EdgeDesk application
      shell: bash
      run: ditto -c -k --sequesterRsrc --keepParent flutter/build/macos/Build/Products/Release/EdgeDesk.app
        EdgeDesk-${{ env.VERSION }}-${{ matrix.job.arch }}.app.zip
    - name: Collect macOS app
      uses: actions/upload-artifact@v4
      with:
        name: package-macos-app-${{ matrix.job.arch }}
        path: EdgeDesk-*.app.zip
        if-no-files-found: error
    timeout-minutes: 180
  build-rustdesk-android:
    needs:
    - generate-bridge
    name: build rustdesk android apk ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: aarch64
          target: aarch64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: armv7
          target: armv7-linux-androideabi
          os: ubuntu-24.04
          reltype: release
          suffix: ''
        - arch: x86_64
          target: x86_64-linux-android
          os: ubuntu-24.04
          reltype: release
          suffix: ''
    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
      with:
        tool-cache: false
        android: false
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: false
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL
          || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN
          || '''');

          '
    - name: Install dependencies
      run: "sudo apt-get update\nsudo apt-get install -y \\\n     clang \\\n     cmake\
        \ \\\n     curl \\\n     gcc-multilib \\\n     git \\\n     g++ \\\n     g++-multilib\
        \ \\\n     libayatana-appindicator3-dev \\\n     libasound2-dev \\\n     libc6-dev\
        \ \\\n     libclang-dev \\\n     libunwind-dev \\\n     libgstreamer1.0-dev\
        \ \\\n     libgstreamer-plugins-base1.0-dev \\\n     libgtk-3-dev \\\n   \
        \  libpam0g-dev \\\n     libpulse-dev \\\n     libva-dev \\\n     libxcb-randr0-dev\
        \ \\\n     libxcb-shape0-dev \\\n     libxcb-xfixes0-dev \\\n     libxdo-dev\
        \ \\\n     libxfixes-dev \\\n     llvm-dev \\\n     nasm \\\n     ninja-build\
        \ \\\n     openjdk-17-jdk-headless \\\n     pkg-config \\\n     tree \\\n\
        \     wget\n"
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        ref: ${{ inputs.source-ref }}
    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
      with:
        channel: stable
        flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}
    - name: Patch flutter
      run: 'cd $(dirname $(dirname $(which flutter)))

        [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]] && git apply ${{ github.workspace
        }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff

        '
    - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779
      id: setup-ndk
      with:
        ndk-version: ${{ env.NDK_VERSION }}
        add-to-path: true
    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      run: "case ${{ matrix.job.target }} in\n  aarch64-linux-android)\n    ANDROID_TARGET=arm64-v8a\n\
        \  ;;\n  armv7-linux-androideabi)\n    ANDROID_TARGET=armeabi-v7a\n  ;;\n\
        \  x86_64-linux-android)\n    ANDROID_TARGET=x86_64\n  ;;\n  i686-linux-android)\n\
        \    ANDROID_TARGET=x86\n  ;;\nesac\nif ! ./flutter/build_android_deps.sh\
        \ \"${ANDROID_TARGET}\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" |\
        \ while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"\
        $_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\n"
      shell: bash
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      with:
        toolchain: ${{ env.RUST_VERSION }}
        components: rustfmt
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
      with:
        prefix-key: rustdesk-lib-cache-android
        key: ${{ matrix.job.target }}
    - name: Build rustdesk lib
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: "rustup target add ${{ matrix.job.target }}\ncargo install cargo-ndk --version\
        \ ${{ env.CARGO_NDK_VERSION }} --locked\ncase ${{ matrix.job.target }} in\n\
        \  aarch64-linux-android)\n    ./flutter/ndk_arm64.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a\n\
        \    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so\n\
        \  ;;\n  armv7-linux-androideabi)\n    ./flutter/ndk_arm.sh\n    mkdir -p\
        \ ./flutter/android/app/src/main/jniLibs/armeabi-v7a\n    cp ./target/${{\
        \ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so\n\
        \  ;;\n  x86_64-linux-android)\n    ./flutter/ndk_x64.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86_64\n\
        \    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so\n\
        \  ;;\n  i686-linux-android)\n    ./flutter/ndk_x86.sh\n    mkdir -p ./flutter/android/app/src/main/jniLibs/x86\n\
        \    cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so\n\
        \  ;;\nesac\n"
    - name: Upload Rustdesk library to Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: librustdesk.so.${{ matrix.job.target }}
        path: ./target/${{ matrix.job.target }}/release/liblibrustdesk.so
    - name: Build rustdesk
      shell: bash
      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: "export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH\n# Increase Gradle\
        \ JVM memory for CI builds\nsed -i \"s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g\"\
        \ ./flutter/android/gradle.properties\n# temporary use debug sign config\n\
        sed -i \"s/signingConfigs.release/signingConfigs.debug/g\" ./flutter/android/app/build.gradle\n\
        case ${{ matrix.job.target }} in\n  aarch64-linux-android)\n    mkdir -p ./flutter/android/app/src/main/jniLibs/arm64-v8a\n\
        \    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so\
        \ ./flutter/android/app/src/main/jniLibs/arm64-v8a/\n    cp ./target/${{ matrix.job.target\
        \ }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so\n\
        \    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype\
        \ }}\" --target-platform android-arm64 --split-per-abi\n    mv build/app/outputs/flutter-apk/app-arm64-v8a-${{\
        \ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch\
        \ }}${{ matrix.job.suffix }}.apk\n  ;;\n  armv7-linux-androideabi)\n    mkdir\
        \ -p ./flutter/android/app/src/main/jniLibs/armeabi-v7a\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so\
        \ ./flutter/android/app/src/main/jniLibs/armeabi-v7a/\n    cp ./target/${{\
        \ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so\n\
        \    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype\
        \ }}\" --target-platform android-arm --split-per-abi\n    mv build/app/outputs/flutter-apk/app-armeabi-v7a-${{\
        \ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch\
        \ }}${{ matrix.job.suffix }}.apk\n  ;;\n  x86_64-linux-android)\n    mkdir\
        \ -p ./flutter/android/app/src/main/jniLibs/x86_64\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so\
        \ ./flutter/android/app/src/main/jniLibs/x86_64/\n    cp ./target/${{ matrix.job.target\
        \ }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so\n\
        \    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype\
        \ }}\" --target-platform android-x64 --split-per-abi\n    mv build/app/outputs/flutter-apk/app-x86_64-${{\
        \ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch\
        \ }}${{ matrix.job.suffix }}.apk\n  ;;\n  i686-linux-android)\n    mkdir -p\
        \ ./flutter/android/app/src/main/jniLibs/x86\n    cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so\
        \ ./flutter/android/app/src/main/jniLibs/x86/\n    cp ./target/${{ matrix.job.target\
        \ }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so\n\
        \    # build flutter\n    pushd flutter\n    flutter build apk \"--${{ matrix.job.reltype\
        \ }}\" --target-platform android-x86 --split-per-abi\n    mv build/app/outputs/flutter-apk/app-x86-${{\
        \ matrix.job.reltype }}.apk ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch\
        \ }}${{ matrix.job.suffix }}.apk\n  ;;\nesac\npopd\nmkdir -p signed-apk; pushd\
        \ signed-apk\nmv ../rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{\
        \ matrix.job.suffix }}.apk .\n"
    - name: Setup sign tool version variable
      shell: bash
      run: 'BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail
        -n 1)

        echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

        echo Last build tool version is: $BUILD_TOOL_VERSION

        '
    - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407
      name: Sign app APK
      if: env.ANDROID_SIGNING_KEY != null
      id: sign-rustdesk
      with:
        releaseDirectory: ./signed-apk
        signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
        alias: ${{ secrets.ANDROID_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}
    - name: Collect Publish signed apk package
      uses: actions/upload-artifact@v4
      with:
        name: package-build-rustdesk-android-18-${{ matrix.job.arch }}
        path: '${{steps.sign-rustdesk.outputs.signedReleaseFile}}

          '
        if-no-files-found: error
      if: env.ANDROID_SIGNING_KEY != null && env.UPLOAD_ARTIFACT == 'true'
