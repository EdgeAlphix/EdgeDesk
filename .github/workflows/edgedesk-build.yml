      env:
        JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      run: "export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH\n# Increase Gradle\
        \ JVM memory for CI builds\nsed -i \"s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g\"\
        \ ./flutter/android/gradle.properties\n# temporary use debug sign config\n\
        sed -i \"s/signingConfigs.release/signingConfigs.debug/g\" ./flutter/android/app/build.gradle\n\
        mv ./flutter/android/app/src/main/jniLibs/arm64-v8a/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so\n\
        cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so\
        \ ./flutter/android/app/src/main/jniLibs/arm64-v8a/\nmv ./flutter/android/app/src/main/jniLibs/armeabi-v7a/liblibrustdesk.so\
        \ ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so\ncp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/libc++_shared.so\
        \ ./flutter/android/app/src/main/jniLibs/armeabi-v7a/\nmv ./flutter/android/app/src/main/jniLibs/x86_64/liblibrustdesk.so\
        \ ./flutter/android/app/src/main/jniLibs/x86_64/librustdesk.so\ncp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so\
        \ ./flutter/android/app/src/main/jniLibs/x86_64/\nif [ \"${{ env.reltype }}\"\
        \ = \"debug\" ]; then\n  mv ./flutter/android/app/src/main/jniLibs/x86/liblibrustdesk.so\
        \ ./flutter/android/app/src/main/jniLibs/x86/librustdesk.so\n  cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/i686-linux-android/libc++_shared.so\
        \ ./flutter/android/app/src/main/jniLibs/x86/\nfi\n# build flutter\npushd\
        \ flutter\nflutter build apk \"--${{ env.reltype }}\" --target-platform android-arm64,android-arm,android-x64${{\
        \ env.x86_target }}\npopd\nmkdir -p signed-apk\nmv ./flutter/build/app/outputs/flutter-apk/app-${{\
        \ env.reltype }}.apk signed-apk/rustdesk-${{ env.VERSION }}-universal${{ env.suffix\
        \ }}.apk\n"
    - name: Setup sign tool version variable
      shell: bash
      run: 'BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail
        -n 1)

        echo "ANDROID_SIGN_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV

        echo Last build tool version is: $BUILD_TOOL_VERSION

        '
    - uses: r0adkll/sign-android-release@349ebdef58775b1e0d8099458af0816dc79b6407
      name: Sign app APK
      if: env.ANDROID_SIGNING_KEY != null
      id: sign-rustdesk
      with:
        releaseDirectory: ./signed-apk
        signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
        alias: ${{ secrets.ANDROID_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: ${{ env.ANDROID_SIGN_TOOL_VERSION }}
    - name: Collect Publish signed apk package
      uses: actions/upload-artifact@v4
      with:
        name: package-build-rustdesk-android-universal-15-universal
        path: '${{steps.sign-rustdesk.outputs.signedReleaseFile}}

          '
        if-no-files-found: error
      if: env.ANDROID_SIGNING_KEY != null && env.UPLOAD_ARTIFACT == 'true'
    - name: Collect Publish unsigned apk package
      uses: actions/upload-artifact@v4
      with:
        name: package-build-rustdesk-android-universal-16-universal
        path: 'signed-apk/rustdesk-${{ env.VERSION }}-universal${{ env.suffix }}.apk

          '
        if-no-files-found: error
      if: env.ANDROID_SIGNING_KEY == null && env.UPLOAD_ARTIFACT == 'true'
    timeout-minutes: 180
  build-rustdesk-linux:
    needs:
    - generate-bridge
    name: build rustdesk linux ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.on }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - arch: x86_64
          target: x86_64-unknown-linux-gnu
          distro: ubuntu18.04
          'on': ubuntu-22.04
          deb_arch: amd64
          vcpkg-triplet: x64-linux
        - arch: aarch64
          target: aarch64-unknown-linux-gnu
          distro: ubuntu18.04
          'on': ubuntu-22.04-arm
          deb_arch: arm64
          vcpkg-triplet: arm64-linux
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
      with:
        script: 'core.exportVariable(''ACTIONS_CACHE_URL'', process.env.ACTIONS_CACHE_URL
          || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN
          || '''');

          '
    - name: Maximize build space
      run: "sudo rm -rf /opt/ghc\nsudo rm -rf /usr/local/lib/android\nsudo rm -rf\
        \ /usr/share/dotnet\nsudo apt-get update -y\nsudo apt-get install -y nasm\n\
        if [[ \"${{ matrix.job.arch }}\" == \"x86_64\" ]]; then\n  sudo apt-get install\
        \ -y qemu-user-static\nfi\n"
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        ref: ${{ inputs.source-ref }}
    - name: Set Swap Space
      if: ${{ matrix.job.arch == 'x86_64' }}
      uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c
      with:
        swap-size-gb: 12
    - name: Free Space
      run: 'df -h

        free -m

        '
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: rustfmt
    - name: Save Rust toolchain version
      run: 'RUST_TOOLCHAIN_VERSION=$(cargo --version | awk ''{print $2}'')

        echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV

        '
    - name: Disable rust bridge build
      run: '# only build cdylib

        sed -i  "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

        '
    - name: Restore bridge files
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - name: Setup vcpkg with Github Actions binary cache
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false
    - name: Install vcpkg dependencies
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      run: "sudo apt install -y libva-dev && apt show libva-dev\nif ! $VCPKG_ROOT/vcpkg\
        \ \\\n  install \\\n  --triplet ${{ matrix.job.vcpkg-triplet }} \\\n  --x-install-root=\"\
        $VCPKG_ROOT/installed\"; then\n  find \"${VCPKG_ROOT}/\" -name \"*.log\" |\
        \ while read -r _1; do\n    echo \"$_1:\"\n    echo \"======\"\n    cat \"\
        $_1\"\n    echo \"======\"\n    echo \"\"\n  done\n  exit 1\nfi\nhead -n 100\
        \ \"${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log\"\
        \ || true\n"
      shell: bash
    - name: Restore bridge files
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: bridge-artifact
        path: ./
    - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8
      name: Build rustdesk
      id: vcpkg
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      with:
        arch: ${{ matrix.job.arch }}
        distro: ${{ matrix.job.distro }}
        githubToken: ${{ github.token }}
        setup: 'ls -l "${PWD}"

          ls -l /opt/artifacts/vcpkg/installed

          '
        dockerRunArgs: '--volume "${PWD}:/workspace"

          --volume "/opt/artifacts:/opt/artifacts"

          '
        shell: /bin/bash
        install: "apt-get update -y\necho -e \"installing deps\"\napt-get install\
          \ -y \\\n   build-essential \\\n   clang \\\n   cmake \\\n   curl \\\n \
          \  gcc \\\n   git \\\n   g++ \\\n   libayatana-appindicator3-dev \\\n  \
          \ libasound2-dev \\\n   libclang-10-dev \\\n   libgstreamer1.0-dev \\\n\
          \   libgstreamer-plugins-base1.0-dev \\\n   libgtk-3-dev \\\n   libpam0g-dev\
          \ \\\n   libpulse-dev \\\n   libva-dev \\\n   libxcb-randr0-dev \\\n   libxcb-shape0-dev\
          \ \\\n   libxcb-xfixes0-dev \\\n   libxdo-dev \\\n   libxfixes-dev \\\n\
          \   llvm-10-dev \\\n   nasm \\\n   ninja-build \\\n   pkg-config \\\n  \
          \ tree \\\n   python3 \\\n   rpm \\\n   unzip \\\n   wget \\\n   xz-utils\
          \ \\\n   libssl-dev\n# we have libopus compiled by us.\napt-get remove -y\
          \ libopus-dev || true\n# output devs\nls -l ./\ntree -L 3 /opt/artifacts/vcpkg/installed\n"
        run: "# disable git safe.directory\ngit config --global --add safe.directory\
          \ \"*\"\n# rust\npushd /opt\n# do not use rustup, because memory overflow\
          \ in qemu\nwget -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{\
          \ matrix.job.target }}.tar.gz\ntar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz\n\
          cd rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }} && ./install.sh\n\
          rm -rf rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }}\n#\
          \ edit config\nmkdir -p ~/.cargo/\necho \"\"\"\n  [source.crates-io]\n \
          \ registry = 'https://github.com/rust-lang/crates.io-index'\n\"\"\" > ~/.cargo/config\n\
          cat ~/.cargo/config\n# start build\npushd /workspace\nexport VCPKG_ROOT=/opt/artifacts/vcpkg\n\
          if [[ \"${{ matrix.job.arch }}\" == \"aarch64\" ]]; then\n  export JOBS=\"\
          --jobs 3\"\nelse\n  export JOBS=\"\"\nfi\necho $JOBS\ncargo build --locked\
          \ --lib $JOBS --features hwcodec,flutter,unix-file-copy-paste --release\n\
          rm -rf target/release/deps target/release/build\nrm -rf ~/.cargo\n\n# Setup\
          \ Flutter\n# disable git safe.directory\ngit config --global --add safe.directory\
          \ \"*\"\npushd /workspace\ncase ${{ matrix.job.arch }} in\n  aarch64)\n\
          \    export PATH=/opt/flutter-elinux/bin:$PATH\n    sed -i \"s/flutter build\
          \ linux --release/flutter-elinux build linux --verbose/g\" ./build.py\n\
          \    sed -i \"s/x64\\/release/arm64\\/release/g\" ./build.py\n  ;;\n  x86_64)\n\
          \    export PATH=/opt/flutter/bin:$PATH\n  ;;\nesac\npopd\npushd /opt\n\
          wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{\
          \ env.FLUTTER_VERSION }}-stable.tar.xz\ntar xf flutter_linux_${{ env.FLUTTER_VERSION\
          \ }}-stable.tar.xz\ncase ${{ matrix.job.arch }} in\n  aarch64)\n    # clone\
          \ repo and reset to flutter ${{ env.FLUTTER_VERSION }}\n    git clone https://github.com/sony/flutter-elinux.git\
          \ || true\n    pushd flutter-elinux\n      git fetch\n      git reset --hard\
          \ ${{ env.FLUTTER_VERSION }}\n      bin/flutter-elinux doctor -v\n     \
          \ bin/flutter-elinux precache --linux\n    popd\n    cp -R flutter/bin/cache/artifacts/engine/linux-x64/shader_lib\
          \ flutter-elinux/flutter/bin/cache/artifacts/engine/linux-arm64\n    rm\
          \ -rf flutter\n  ;;\n  x86_64)\n    flutter doctor -v\n  ;;\nesac\n\nif\
          \ [[ \"3.24.5\" == ${{ env.FLUTTER_VERSION }} ]]; then\n  case ${{ matrix.job.arch\
          \ }} in\n    aarch64)\n      pushd /opt/flutter-elinux/flutter\n    ;;\n\
          \    x86_64)\n      pushd /opt/flutter\n    ;;\n  esac\n  git apply ${{\
          \ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff\n\
          \  popd\nfi\n\n# build flutter\npushd /workspace\nexport CARGO_INCREMENTAL=0\n\
          export DEB_ARCH=${{ matrix.job.deb_arch }}\npython3 ./build.py --flutter\
          \ --skip-cargo\nfor name in rustdesk*??.deb; do\n  mv \"$name\" \"${name%%.deb}-${{\
          \ matrix.job.arch }}.deb\"\ndone\n\n# rpm package\necho -e \"start packaging\
          \ fedora package\"\npushd /workspace\ncase ${{ matrix.job.arch }} in\n \
          \ aarch64)\n    sed -i \"s/linux\\/x64/linux\\/arm64/g\" ./res/rpm-flutter.spec\n\
          \    ;;\nesac\nHBB=`pwd` rpmbuild ./res/rpm-flutter.spec -bb\npushd ~/rpmbuild/RPMS/${{\
          \ matrix.job.arch }}\nfor name in edgedesk*??.rpm; do\n    mv \"$name\"\
          \ /workspace/\"${name%%.rpm}.rpm\"\ndone\n\n# rpm suse package\necho -e\
          \ \"start packaging suse package\"\npushd /workspace\ncase ${{ matrix.job.arch\
          \ }} in\n  aarch64)\n    sed -i \"s/linux\\/x64/linux\\/arm64/g\" ./res/rpm-flutter-suse.spec\n\
          \    ;;\nesac\nHBB=`pwd` rpmbuild ./res/rpm-flutter-suse.spec -bb\npushd\
          \ ~/rpmbuild/RPMS/${{ matrix.job.arch }}\nfor name in edgedesk*??.rpm; do\n\
          \    mv \"$name\" /workspace/\"${name%%.rpm}-suse.rpm\"\ndone\n"
    - name: Collect Publish debian/rpm package
      uses: actions/upload-artifact@v4
      with:
        name: package-build-rustdesk-linux-13-${{ matrix.job.arch }}
        path: 'rustdesk-*.deb

          edgedesk-*.rpm

          '
        if-no-files-found: error
      if: env.UPLOAD_ARTIFACT == 'true'
    - name: Upload deb
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: env.UPLOAD_ARTIFACT == 'true'
      with:
        name: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.deb
        path: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.deb
    - name: Patch archlinux PKGBUILD
      if: matrix.job.arch == 'x86_64' && env.UPLOAD_ARTIFACT == 'true'
      run: "sed -i \"s/x86_64/${{ matrix.job.arch }}/g\" res/PKGBUILD\nif [[ \"${{\
        \ matrix.job.arch }}\" == \"aarch64\" ]]; then\n  sed -i \"s/x86_64/aarch64/g\"\
        \ ./res/PKGBUILD\nfi\n"
    - name: Build archlinux package
      if: matrix.job.arch == 'x86_64' && env.UPLOAD_ARTIFACT == 'true'
      uses: rustdesk-org/arch-makepkg-action@04200739ed1d0bf6f2188b6736b26a767c57a7f9
      with:
        packages: null
        scripts: 'cd res && HBB=`pwd`/.. FLUTTER=1 makepkg -f

          '
    - name: Collect Publish archlinux package
      uses: actions/upload-artifact@v4
      with:
        name: package-build-rustdesk-linux-17-${{ matrix.job.arch }}
        path: 'res/edgedesk-${{ env.VERSION }}*.zst

          '
        if-no-files-found: error
      if: matrix.job.arch == 'x86_64' && env.UPLOAD_ARTIFACT == 'true'
    timeout-minutes: 180
  build-appimage:
    name: Build appimage ${{ matrix.job.target }}
    needs:
    - build-rustdesk-linux
    runs-on: ubuntu-22.04
    if: ${{ inputs.upload-artifact }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-unknown-linux-gnu
          arch: x86_64
        - target: aarch64-unknown-linux-gnu
          arch: aarch64
    steps:
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        ref: ${{ inputs.source-ref }}
    - name: Download Binary
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.deb
        path: .
    - name: Rename Binary
      run: 'mv rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.deb appimage/rustdesk.deb

        '
    - name: Build appimage package
      shell: bash
      run: '# install libarchive-tools for bsdtar command used in AppImageBuilder.yml

        sudo apt-get update -y

        # https://github.com/AppImage/AppImageKit/wiki/FUSE

        sudo apt-get install -y libarchive-tools libfuse2

        # set-up appimage-builder

        # https://github.com/AppImage/AppImageKit/issues/1395

        sudo pip3 install "setuptools_scm<10"

        sudo pip3 install git+https://github.com/rustdesk-org/appimage-builder.git

        # run appimage-builder

        pushd appimage

        sudo appimage-builder --skip-tests --recipe ./AppImageBuilder-${{ matrix.job.arch
        }}.yml

        '
    - name: Collect Publish appimage package
      uses: actions/upload-artifact@v4
      with:
        name: package-build-appimage-4-${{ matrix.job.arch }}
        path: './appimage/edgedesk-${{ env.VERSION }}-*.AppImage

          '
        if-no-files-found: error
      if: env.UPLOAD_ARTIFACT == 'true'
    timeout-minutes: 180
  build-flatpak:
    name: Build flatpak ${{ matrix.job.target }}${{ matrix.job.suffix }}
    needs:
    - build-rustdesk-linux
    runs-on: ${{ matrix.job.on }}
    if: ${{ inputs.upload-artifact }}
    strategy:
      fail-fast: false
      matrix:
        job:
        - target: x86_64-unknown-linux-gnu
          distro: ubuntu22.04
          'on': ubuntu-22.04
          arch: x86_64
          suffix: ''
        - target: aarch64-unknown-linux-gnu
          distro: ubuntu22.04
          'on': ubuntu-22.04-arm
          arch: aarch64
          suffix: ''
    steps:
    - name: Checkout source code
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        ref: ${{ inputs.source-ref }}
    - name: Download Binary
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix
          }}.deb
        path: .
    - name: Rename Binary
      run: 'mv rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix
        }}.deb flatpak/rustdesk.deb

        '
    - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8
      name: Build rustdesk flatpak package for ${{ matrix.job.arch }}
      id: flatpak
      with:
        arch: ${{ matrix.job.arch }}
        distro: ${{ matrix.job.distro }}
        githubToken: ${{ github.token }}
        setup: 'ls -l "${PWD}"

          '
        dockerRunArgs: '--volume "${PWD}:/workspace"

          '
        shell: /bin/bash
        install: 'apt-get update -y

          apt-get install -y git flatpak flatpak-builder

          '
        run: '# disable git safe.directory

          git config --global --add safe.directory "*"

          pushd /workspace

          # flatpak deps

          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

          # package

          pushd flatpak

          git clone https://github.com/flathub/shared-modules.git --depth=1

          flatpak-builder --user --install-deps-from=flathub -y --force-clean --repo=repo
          ./build ./rustdesk.json

          flatpak build-bundle ./repo rustdesk-${{ env.VERSION }}-${{ matrix.job.arch
          }}${{ matrix.job.suffix }}.flatpak com.edgealphix.desk

          '
    - name: Collect Publish flatpak package
      uses: actions/upload-artifact@v4
      with:
        name: package-build-flatpak-4-${{ matrix.job.arch }}
        path: 'flatpak/rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}${{ matrix.job.suffix
          }}.flatpak

          '
        if-no-files-found: error
    timeout-minutes: 180
permissions:
  contents: read
